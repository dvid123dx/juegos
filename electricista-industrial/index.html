<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Electricista Industrial — Simulador de Arranques</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header id="topbar">
  <div id="topbar-left">
    <button id="btn-back" class="icon-btn" title="Regresar un paso">←</button>
    <button id="btn-home" class="icon-btn" title="Menú principal">⌂</button>
    <span id="crumb">Electricista Industrial</span>
  </div>
  <div id="topbar-right">
    <button id="btn-sound" class="icon-btn" title="Silenciar/activar sonido">🔊</button>

  </div>
</header>

<main id="app"></main>

<template id="tpl-menu">
  <section class="screen menu-screen">
    <h1 class="brand">ELECTRICISTA <span>INDUSTRIAL</span></h1>
    <p class="brand-sub">Simulador de arranques de motores — control, fuerza, planos y teoría</p>
    <div class="menu-grid">
      <button class="menu-card" data-nav="explorer">
        <span class="menu-icon">⧉</span>
        <span class="menu-title">Explorador de Componentes</span>
        <span class="menu-desc">Gira e inspecciona en 3D contactores, relés, botones, motores y más</span>
      </button>
      <button class="menu-card" data-nav="challenges">
        <span class="menu-icon">⌁</span>
        <span class="menu-title">Retos de Cableado</span>
        <span class="menu-desc">Arma circuitos de control y fuerza: directo, estrella-triángulo, autotransformador y reversa</span>
      </button>
      <button class="menu-card" data-nav="planos">
        <span class="menu-icon">▤</span>
        <span class="menu-title">Planos de Referencia</span>
        <span class="menu-desc">Consulta los diagramas ya resueltos antes de intentar un reto</span>
      </button>
      <button class="menu-card" data-nav="quiz">
        <span class="menu-icon">?</span>
        <span class="menu-title">Quiz Teórico</span>
        <span class="menu-desc">Pon a prueba lo aprendido con preguntas de opción múltiple</span>
      </button>
      <button class="menu-card" data-nav="free">
        <span class="menu-icon">✎</span>
        <span class="menu-title">Modo Libre</span>
        <span class="menu-desc">Arma tu propio circuito de control desde cero, con cualquier componente, y córrelo en vivo</span>
      </button>
      <button class="menu-card" data-nav="diagnostico">
        <span class="menu-icon">⚠</span>
        <span class="menu-title">Modo Diagnóstico</span>
        <span class="menu-desc">Circuitos pre-cableados con una falla real reportada — encuéntrala y corrígela, como en un tablero de verdad</span>
      </button>
      <button class="menu-card" data-nav="referencia">
        <span class="menu-icon">📖</span>
        <span class="menu-title">Manual de Referencia</span>

</template>

<template id="tpl-explorer">
  <section class="screen explorer-screen">
    <h2 class="screen-title">Explorador de Componentes</h2>
    <p class="screen-sub">Arrastra sobre la tarjeta para girar el componente. Haz clic en la lista para cambiar de pieza.</p>
    <div class="explorer-layout">
      <div class="explorer-list" id="explorer-list"></div>
      <div class="explorer-stage">
        <div class="stage3d" id="stage3d">
          <div class="cube" id="cube3d"></div>
        </div>
        <div class="explorer-info" id="explorer-info"></div>
      </div>
    </div>
  </section>
</template>

<template id="tpl-diagnostics">
  <section class="screen challenges-screen">
    <h2 class="screen-title">Modo Diagnóstico</h2>
    <p class="screen-sub">El circuito ya está cableado, pero alguien reportó una falla. Léela, opera el circuito para observarla en vivo, y localiza el cable responsable con "Verificar".</p>
    <div class="challenge-row" id="diagnostics-list"></div>
  </section>
</template>

<template id="tpl-challenges">
  <section class="screen challenges-screen">
    <h2 class="screen-title">Retos de Cableado</h2>
    <p class="screen-sub">Elige un método de arranque y practica su circuito de control o de fuerza.</p>
    <p class="challenges-progress" id="challenges-progress"></p>
    <div class="challenge-groups" id="challenge-groups"></div>
  </section>
</template>

<template id="tpl-wiring">
  <section class="screen wiring-screen">
    <div class="wiring-header">
      <h2 class="screen-title" id="wiring-title"></h2>
      <p class="screen-sub" id="wiring-brief"></p>
    </div>
    <div class="wiring-layout">
      <div class="wiring-canvas-wrap">
        <svg id="wiring-svg" class="wiring-svg"></svg>
      </div>
      <div class="wiring-side">
        <div class="wiring-status" id="wiring-status">Conecta las terminales haciendo clic en una y luego en otra.</div>
        <div class="wiring-actions">
          <button id="btn-check" class="btn btn-primary">Verificar cableado</button>
          <button id="btn-undo" class="btn">↺ Deshacer cable</button>
          <button id="btn-hint" class="btn">Pista</button>
          <button id="btn-clear" class="btn btn-danger">Borrar todo</button>
        </div>
        <button id="btn-simulate" class="btn btn-accent">▶ Ver demostración guiada</button>
        <div id="panel3d-section" class="panel3d-section hidden">
          <h3 class="panel3d-title">Panel de Operación 3D <span>— arrastra para rotarlo</span></h3>
          <div class="panel3d-stage" id="panel3d-stage">
            <div class="panel3d-box" id="panel3d-box"></div>
          </div>
        </div>
        <div class="wiring-log" id="wiring-log"></div>
      </div>
    </div>
  </section>
</template>

    </div>
    <div class="wiring-layout">

          <h3 class="pane-title">Circuito de Control</h3>

            <svg id="wiringc-svg-c" class="wiring-svg"></svg>

          <div class="pane-actions">
            <button id="btnc-check-c" class="btn btn-primary">Verificar control</button>
            <button id="btnc-undo-c" class="btn">↺ Deshacer</button>
            <button id="btnc-clear-c" class="btn btn-danger">Borrar</button>
          </div>
        </div>
        <div class="wiring-pane">
          <h3 class="pane-title">Circuito de Fuerza</h3>
          <div class="wiring-canvas-wrap">
            <svg id="wiringc-svg-p" class="wiring-svg"></svg>
          </div>
          <div class="pane-status" id="wiringc-status-p">Conecta las terminales de fuerza.</div>
          <div class="pane-actions">
            <button id="btnc-check-p" class="btn btn-primary">Verificar fuerza</button>

        <div id="panel3d-section" class="panel3d-section hidden">
          <h3 class="panel3d-title">Panel de Operación 3D <span>— arrastra para rotarlo</span></h3>

            <div class="panel3d-box" id="panel3d-box"></div>

<template id="tpl-planos">

<template id="tpl-quiz">

<template id="tpl-referencia">
  <section class="screen referencia-screen">
    <h2 class="screen-title">Manual de Referencia</h2>
    <p class="screen-sub">Consulta rápida de convenciones, numeración normalizada y fórmulas — el mismo lenguaje que verás en un tablero real.</p>
    <div class="ref-grid">

      <div class="ref-card">
        <h3>Colores de conductores (referencia NOM-001-SEDE)</h3>
        <table class="ref-table">
          <tr><th>Color</th><th>Uso</th></tr>
          <tr><td><span class="swatch" style="background:#111"></span> Negro</td><td>Fase (línea) en circuitos monofásicos y trifásicos</td></tr>
          <tr><td><span class="swatch" style="background:#c22b2b"></span> Rojo</td><td>Fase secundaria / circuitos de control</td></tr>
          <tr><td><span class="swatch" style="background:#2a5ad1"></span> Azul</td><td>Fase terciaria (en instalaciones trifásicas de 3 colores)</td></tr>
          <tr><td><span class="swatch" style="background:#e8e8e8;border:1px solid #888"></span> Blanco / Gris</td><td>Neutro</td></tr>
          <tr><td><span class="swatch" style="background:#2fae57"></span> Verde (o verde/amarillo)</td><td>Tierra física (protección)</td></tr>
          <tr><td><span class="swatch" style="background:#ff8a3d"></span> Naranja</td><td>Partes energizadas de un circuito interconectado con doble alimentación (ej. transferencia)</td></tr>
        </table>
        <p class="ref-note">La convención exacta varía por país/norma (NOM en México, NEC/NFPA 70 en EUA, IEC en Europa) — siempre confirma contra el plano y la norma local antes de trabajar.</p>
      </div>

      <div class="ref-card">
        <h3>Numeración normalizada de terminales (IEC)</h3>
        <table class="ref-table">
          <tr><th>Terminales</th><th>Función</th></tr>
          <tr><td>A1 - A2</td><td>Bobina de contactor, relé o temporizador</td></tr>
          <tr><td>1-2, 3-4, 5-6</td><td>Contactos principales de potencia (siempre número impar arriba)</td></tr>
          <tr><td>13-14, 23-24, 33-34...</td><td>Contactos auxiliares normalmente abiertos (NA)</td></tr>
          <tr><td>21-22, 31-32, 41-42...</td><td>Contactos auxiliares normalmente cerrados (NC)</td></tr>
          <tr><td>95-96</td><td>Contacto NC del relé térmico (protección)</td></tr>
          <tr><td>97-98</td><td>Contacto NA del relé térmico (señalización de disparo)</td></tr>
          <tr><td>15-16 / 15-18</td><td>Temporizador: contacto NC / NA con retardo (a la energización)</td></tr>
          <tr><td>25-26 / 25-28</td><td>Segundo juego de contactos retardados del mismo temporizador</td></tr>
          <tr><td>1L1-2T1, 3L2-4T2, 5L3-6T3</td><td>Guardamotor / interruptor termomagnético (entrada L, salida T)</td></tr>
        </table>
      </div>

      <div class="ref-card">
        <h3>Designadores de referencia comunes</h3>
        <table class="ref-table">
          <tr><th>Letra</th><th>Dispositivo</th></tr>
          <tr><td>K / KM</td><td>Contactor o relé (KM para contactor de motor específicamente)</td></tr>
          <tr><td>KT</td><td>Relé de tiempo (temporizador)</td></tr>
          <tr><td>CR</td><td>Relé de control auxiliar</td></tr>
          <tr><td>F</td><td>Fusible o dispositivo de protección (F1 fusible, F2 térmico típico)</td></tr>
          <tr><td>Q</td><td>Interruptor automático / guardamotor / seccionador</td></tr>
          <tr><td>S</td><td>Interruptor de mando manual (S0 paro, S1 marcha por convención)</td></tr>
          <tr><td>SB</td><td>Botón pulsador (variante IEC de "S")</td></tr>
          <tr><td>H</td><td>Lámpara piloto o indicador (H1, H2...)</td></tr>
          <tr><td>M</td><td>Motor</td></tr>
          <tr><td>T / TC</td><td>Transformador (TC = transformador de control)</td></tr>
          <tr><td>LS</td><td>Interruptor de límite (fin de carrera)</td></tr>
          <tr><td>FS</td><td>Interruptor de flotador (nivel de líquido)</td></tr>
          <tr><td>PC / PE</td><td>Fotocelda / sensor fotoeléctrico</td></tr>
          <tr><td>YV</td><td>Electroválvula / actuador solenoide</td></tr>
        </table>
      </div>

      <div class="ref-card">
        <h3>Abreviaturas frecuentes</h3>
        <table class="ref-table">
          <tr><th>Sigla</th><th>Significado</th></tr>
          <tr><td>NA / NO</td><td>Normalmente Abierto / Normally Open</td></tr>
          <tr><td>NC / NF</td><td>Normalmente Cerrado / Normally Closed (Fermé)</td></tr>
          <tr><td>DOL</td><td>Direct On Line — arranque directo a tensión plena</td></tr>
          <tr><td>VFD / VDF</td><td>Variable Frequency Drive — variador de frecuencia</td></tr>
          <tr><td>MCB</td><td>Miniature Circuit Breaker — minidisyuntor termomagnético</td></tr>
          <tr><td>MCC</td><td>Motor Control Center — centro de control de motores</td></tr>
          <tr><td>PLC</td><td>Programmable Logic Controller — controlador lógico programable</td></tr>
          <tr><td>FLA / FLC</td><td>Full Load Amps/Current — corriente a plena carga</td></tr>
          <tr><td>LRA</td><td>Locked Rotor Amps — corriente de rotor bloqueado (arranque)</td></tr>
          <tr><td>FP</td><td>Factor de Potencia</td></tr>
          <tr><td>ATS</td><td>Automatic Transfer Switch — transferencia automática</td></tr>
          <tr><td>GFCI / RCD</td><td>Interruptor diferencial (falla a tierra)</td></tr>
        </table>
      </div>

      <div class="ref-card">
        <h3>Fórmulas básicas de motores</h3>
        <table class="ref-table">
          <tr><th>Cálculo</th><th>Fórmula</th></tr>
          <tr><td>Corriente monofásica</td><td>I = P / (V × FP)</td></tr>
          <tr><td>Corriente trifásica</td><td>I = P / (V × √3 × FP)</td></tr>
          <tr><td>Potencia trifásica</td><td>P = √3 × V × I × FP</td></tr>
          <tr><td>Velocidad síncrona (RPM)</td><td>Ns = 120 × f / polos</td></tr>
          <tr><td>Deslizamiento</td><td>s = (Ns − Nr) / Ns</td></tr>
          <tr><td>Corriente de arranque estimada</td><td>6 a 8 veces la corriente nominal (arranque directo)</td></tr>
          <tr><td>Reducción con estrella-triángulo</td><td>≈ 33% de la corriente y el par de arranque directo</td></tr>
        </table>
        <p class="ref-note">FP = factor de potencia, f = frecuencia de línea (Hz), Ns = velocidad síncrona, Nr = velocidad real del rotor.</p>
      </div>

      <div class="ref-card">
        <h3>Niveles de tensión comunes (México)</h3>
        <table class="ref-table">
          <tr><th>Tensión</th><th>Uso típico</th></tr>
          <tr><td>127V monofásico (L-N)</td><td>Contactos residenciales, alumbrado, control de baja potencia</td></tr>
          <tr><td>220V monofásico / bifásico</td><td>Electrodomésticos de mayor potencia, aires acondicionados residenciales</td></tr>
          <tr><td>220V trifásico</td><td>Motores pequeños y medianos en instalaciones comerciales</td></tr>
          <tr><td>440V trifásico</td><td>Motores industriales de mayor potencia</td></tr>
          <tr><td>24V / 110V de control</td><td>Circuitos de mando reducidos mediante transformador de control (TC), por seguridad</td></tr>
        </table>
      </div>

      <div class="ref-card">
        <h3>Buenas prácticas de diagnóstico</h3>
        <ul class="ref-list">
          <li>Antes de medir o tocar cualquier terminal, confirma que el circuito esté desenergizado y bloqueado (LOTO — Lockout/Tagout).</li>
          <li>Compara siempre el comportamiento observado contra el diagrama de referencia — la mayoría de las fallas son un solo cable en la posición equivocada.</li>
          <li>Un motor que arranca pero no se sella casi siempre apunta al contacto auxiliar de sello (13-14) mal conectado o ausente.</li>
          <li>Dos contactores que deberían ser mutuamente excluyentes energizándose juntos es una falla grave de enclavamiento — puede provocar cortocircuito entre fases.</li>
          <li>Si el arrancador a tensión reducida pasa directo a tensión plena sin la etapa reducida, sospecha de los contactos del temporizador (instantáneo vs. retardado) cruzados.</li>
          <li>Verifica siempre con el diagrama de control Y el de fuerza — muchas fallas "eléctricas" son mecánicas (fin de carrera desajustado, flotador atorado, etc.).</li>
        </ul>
      </div>

      <div class="ref-card">
        <h3>Guía de fallas por síntoma</h3>
        <table class="ref-table">
          <tr><th>Síntoma</th><th>Causa probable</th><th>Dónde revisar</th></tr>
          <tr><td>El motor no arranca al presionar marcha</td><td>Térmico disparado, fusible abierto, o el paro no regresó a reposo</td><td>F2 (95-96), fusibles, S0</td></tr>
          <tr><td>El motor arranca pero no se sella</td><td>Falta el contacto de sello (13-14) o está mal conectado</td><td>K1aux1 en paralelo con el botón de marcha</td></tr>
          <tr><td>Arranca directo, sin pasar por la etapa reducida</td><td>Contactos instantáneo/retardado del temporizador cruzados</td><td>KT (15-16 vs. 15-18)</td></tr>
          <tr><td>Dos contactores enclavados energizan juntos</td><td>Falla de enclavamiento eléctrico (o mecánico)</td><td>Contactos NC cruzados de enclavamiento</td></tr>
          <tr><td>El motor gira al revés de lo esperado</td><td>Botones de mando cruzados, o dos fases invertidas en fuerza</td><td>Botones S1/S2, terminales U/V/W del motor</td></tr>
          <tr><td>El piloto no enciende con el motor en marcha</td><td>Contacto auxiliar de señalización mal conectado o foco fundido</td><td>K1aux2/K1aux3, la lámpara misma</td></tr>
          <tr><td>El compresor o la bomba nunca se detiene</td><td>El presostato/flotador quedó en NA en vez de NC, o descalibrado</td><td>PS1 / FS1</td></tr>
          <tr><td>La alarma sonora no suena</td><td>El sensor no cierra su contacto, o falta alimentación al sello</td><td>LS1/sensor, relé auxiliar CR</td></tr>
          <tr><td>Ambos motores se detienen sin razón aparente</td><td>El relé maestro (KA) se desenergizó — revisa el E-stop y su rearme</td><td>E-stop, botón de rearme, KAaux</td></tr>
        </table>
      </div>

      <div class="ref-card">
        <h3>Calibre de conductores (AWG) y ampacidad aproximada</h3>
        <table class="ref-table">
          <tr><th>AWG</th><th>Ampacidad aprox. (cobre, 75°C)</th></tr>
          <tr><td>14</td><td>20 A</td></tr>
          <tr><td>12</td><td>25 A</td></tr>
          <tr><td>10</td><td>35 A</td></tr>
          <tr><td>8</td><td>50 A</td></tr>
          <tr><td>6</td><td>65 A</td></tr>
          <tr><td>4</td><td>85 A</td></tr>
          <tr><td>2</td><td>115 A</td></tr>
          <tr><td>1/0</td><td>150 A</td></tr>
          <tr><td>2/0</td><td>175 A</td></tr>
          <tr><td>4/0</td><td>230 A</td></tr>
        </table>
        <p class="ref-note">Valores de referencia educativa (similares a NEC/NOM tabla 310). Un diseño real siempre debe aplicar factores de corrección por temperatura ambiente y agrupamiento de conductores, y usar la tabla vigente de la norma aplicable.</p>
      </div>

      <div class="ref-card">
        <h3>Corriente a plena carga (FLA) aproximada de motores trifásicos</h3>
        <table class="ref-table">
          <tr><th>Potencia</th><th>220V (A)</th><th>440V (A)</th></tr>
          <tr><td>1 HP</td><td>4.6</td><td>2.3</td></tr>
          <tr><td>2 HP</td><td>7.5</td><td>3.8</td></tr>
          <tr><td>3 HP</td><td>10.6</td><td>5.3</td></tr>
          <tr><td>5 HP</td><td>16.7</td><td>8.4</td></tr>
          <tr><td>7.5 HP</td><td>24.2</td><td>12.1</td></tr>
          <tr><td>10 HP</td><td>30.8</td><td>15.4</td></tr>
          <tr><td>15 HP</td><td>46.2</td><td>23.1</td></tr>
          <tr><td>20 HP</td><td>59.4</td><td>29.7</td></tr>
          <tr><td>25 HP</td><td>74.8</td><td>37.4</td></tr>
        </table>
        <p class="ref-note">Valores típicos para motores de inducción jaula de ardilla (referencia similar a NEC 430.250). El dato de placa del motor real siempre tiene prioridad sobre cualquier tabla genérica.</p>
      </div>

      </div>

      <div class="ref-card">
        <h3>Organismos y normas de referencia</h3>
        <ul class="ref-list">
          <li><strong>NOM-001-SEDE</strong> (México): norma oficial de instalaciones eléctricas.</li>
          <li><strong>NOM-029-STPS</strong> (México): seguridad para trabajos con electricidad.</li>
          <li><strong>NEC / NFPA 70</strong> (EUA): National Electrical Code.</li>
          <li><strong>NFPA 70E</strong> (EUA): seguridad eléctrica en el lugar de trabajo (riesgo de arco).</li>
          <li><strong>IEC 60947 / IEC 60204-1</strong>: aparamenta de baja tensión y seguridad eléctrica de maquinaria.</li>
          <li><strong>UL / CSA</strong>: certificación y listado de equipo en EUA/Canadá.</li>
        </ul>
        <p class="ref-note">Esta app es una herramienta de práctica y estudio — para un diseño o instalación real, consulta siempre la norma vigente y a un profesional certificado.</p>
      </div>

      <div class="ref-card">
        <h3>Lista de verificación: puesta en marcha de un arrancador nuevo</h3>
        <ul class="ref-list">
          <li>Confirma que el guardamotor/interruptor esté en posición de apagado antes de cablear.</li>
          <li>Verifica continuidad y ausencia de cortos con el circuito desenergizado (multímetro en óhmetro).</li>
          <li>Revisa que el ajuste del relé térmico corresponda a la corriente de placa del motor (FLA).</li>
          <li>Energiza primero solo el circuito de control (si hay transformador de control, verifica su tensión secundaria) antes de energizar fuerza.</li>
          <li>Presiona marcha y confirma que el motor gire en el sentido correcto antes de acoplarlo a la carga mecánica.</li>
          <li>Verifica que el paro (normal y de emergencia, si existe) corte el motor de inmediato.</li>
          <li>Documenta cualquier cambio de cableado respecto al plano original.</li>
        </ul>
      </div>

      <div class="ref-card wide">
        <h3>Glosario extendido</h3>
        <div class="glossary-cols">
          <p><strong>Aislamiento eléctrico</strong> — material que impide el paso de corriente entre conductores o hacia tierra.</p>
          <p><strong>Alimentador</strong> — conductor que lleva la energía desde la acometida hasta el tablero de distribución.</p>
          <p><strong>Amperaje</strong> — cantidad de corriente eléctrica, medida en amperes (A).</p>
          <p><strong>Arco eléctrico</strong> — descarga luminosa e intensa que ocurre al abrir/cerrar un circuito bajo falla.</p>
          <p><strong>Armadura</strong> — parte móvil de un motor DC o de un contactor donde se induce el movimiento.</p>
          <p><strong>Bobina</strong> — devanado de alambre que genera un campo magnético al energizarse (A1-A2).</p>
          <p><strong>Bonding</strong> — unión eléctrica intencional de partes metálicas para igualar su potencial.</p>
          <p><strong>Bus DC</strong> — circuito intermedio de corriente directa dentro de un VFD, entre el rectificador y el inversor.</p>
          <p><strong>Cable de control</strong> — conductor de calibre reducido dedicado al circuito de mando, no a la carga principal.</p>
          <p><strong>Calibre (AWG)</strong> — sistema de numeración del grosor de un conductor; a menor número, mayor sección.</p>
          <p><strong>Carga</strong> — cualquier dispositivo que consume energía eléctrica (motor, lámpara, resistencia).</p>
          <p><strong>Clema</strong> — bloque de conexiones que empalma dos o más conductores sin conmutar nada.</p>
          <p><strong>Contactor</strong> — interruptor electromagnético para cargas de potencia, operado por una bobina.</p>
          <p><strong>Corriente de arranque</strong> — corriente elevada y momentánea que consume un motor al energizarse.</p>
          <p><strong>Corriente nominal</strong> — corriente que un dispositivo puede conducir de forma continua sin dañarse.</p>
          <p><strong>Cortocircuito</strong> — conexión no intencional de baja resistencia entre dos puntos de distinto potencial.</p>
          <p><strong>Deslizamiento</strong> — diferencia entre la velocidad síncrona y la velocidad real del rotor de un motor.</p>
          <p><strong>Devanado</strong> — conjunto de espiras de alambre que forman una bobina o el estátor de un motor.</p>
          <p><strong>Diagrama de fuerza</strong> — plano que muestra las conexiones de potencia entre la red y la carga.</p>
          <p><strong>Diagrama de control</strong> — plano que muestra la lógica de mando: botones, bobinas y contactos auxiliares.</p>
          <p><strong>Diagrama unifilar</strong> — representación simplificada de una instalación usando una sola línea por circuito.</p>
          <p><strong>Enclavamiento</strong> — mecanismo eléctrico o mecánico que impide que dos elementos actúen a la vez.</p>
          <p><strong>Factor de potencia</strong> — relación entre la potencia activa útil y la potencia aparente total consumida.</p>
          <p><strong>Falla a tierra</strong> — contacto no intencional entre un conductor energizado y tierra.</p>
          <p><strong>Fase</strong> — cada uno de los conductores activos de un sistema de corriente alterna.</p>
          <p><strong>Fusible</strong> — dispositivo de protección de un solo uso que se funde ante una sobrecorriente.</p>
          <p><strong>Guardamotor</strong> — interruptor termomagnético que protege y desconecta manualmente un circuito de motor.</p>
          <p><strong>Interruptor de límite</strong> — contacto accionado mecánicamente al llegar una pieza móvil a su posición.</p>
          <p><strong>Lazo de control</strong> — conjunto de elementos (sensor, controlador, actuador) que regulan una variable.</p>
          <p><strong>Neutro</strong> — conductor que normalmente lleva corriente de retorno en un sistema monofásico o trifásico.</p>
          <p><strong>Par motor</strong> — fuerza de rotación que un motor puede ejercer sobre su carga.</p>
          <p><strong>Potencia activa (kW)</strong> — potencia que realmente realiza trabajo útil en la carga.</p>
          <p><strong>Potencia aparente (kVA)</strong> — combinación vectorial de la potencia activa y la reactiva.</p>
          <p><strong>Potencia reactiva (kVAR)</strong> — potencia que oscila entre la fuente y las cargas inductivas/capacitivas sin realizar trabajo útil.</p>
          <p><strong>Relé auxiliar</strong> — relé de control sin contactos de potencia, usado para multiplicar señales.</p>
          <p><strong>Relé térmico</strong> — dispositivo que protege al motor contra sobrecargas sostenidas.</p>
          <p><strong>Rotor</strong> — parte giratoria de un motor eléctrico.</p>
          <p><strong>Sello eléctrico</strong> — contacto auxiliar en paralelo con el botón de marcha que mantiene energizada la bobina.</p>
          <p><strong>Sensor</strong> — dispositivo que detecta una condición física (presencia, presión, nivel) y la convierte en señal eléctrica.</p>
          <p><strong>Tablero de control</strong> — gabinete que aloja los dispositivos de mando y protección de una instalación.</p>
          <p><strong>Tensión de línea</strong> — voltaje medido entre dos fases de un sistema trifásico.</p>
          <p><strong>Tensión de fase</strong> — voltaje medido entre una fase y el neutro.</p>
          <p><strong>Terminal</strong> — punto físico de conexión de un conductor a un dispositivo.</p>
          <p><strong>Tierra física</strong> — conexión intencional a la tierra para limitar tensiones peligrosas y facilitar el disparo de protecciones.</p>
          <p><strong>Transformador</strong> — dispositivo que cambia el nivel de tensión de corriente alterna por inducción electromagnética.</p>
          <p><strong>Variador de frecuencia</strong> — equipo que regula la velocidad de un motor AC variando frecuencia y voltaje.</p>
          <p><strong>Contacto NA</strong> — (normalmente abierto) contacto que permanece abierto en reposo.</p>
          <p><strong>Contacto NC</strong> — (normalmente cerrado) contacto que permanece cerrado en reposo.</p>
          <p><strong>Rearme</strong> — acción de restablecer manualmente un dispositivo de protección o de seguridad tras un disparo.</p>
          <p><strong>Placa de datos</strong> — etiqueta del motor con sus características nominales (voltaje, corriente, potencia, etc).</p>
          <p><strong>Barra segura</strong> — nodo de alimentación que solo queda con tensión cuando un relé maestro de seguridad lo permite.</p>
          <p><strong>Interruptor diferencial</strong> — dispositivo que detecta fugas de corriente a tierra y desconecta el circuito.</p>
          <p><strong>Motor jaula de ardilla</strong> — tipo de rotor de motor de inducción con barras conductoras cortocircuitadas en los extremos.</p>
          <p><strong>Rampa de arranque</strong> — incremento gradual de tensión o frecuencia aplicado a un motor durante el arranque.</p>
        </div>
      </div>
